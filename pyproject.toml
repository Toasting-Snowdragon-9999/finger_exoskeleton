[project]
name = "finger_exoskeleton"
version = "0.1.0"
description = "Adaptive hand exoskeleton for Parkinsonian tremor suppression"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib", "dynamixel-sdk"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "flake8",
    "pylint",
    "scipy-stubs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
files = ["run_emg.py", "train_gru.py", "evaluate_gru.py", "settings.py", "source", "tests"]
# Every function has type hints, but plain ones (np.ndarray, dict) are fine
disallow_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Emil's motor code is used as it is
module = ["source.controllers", "source.DynamixelHardwareInterface", "dynamixel_sdk"]
ignore_errors = true
follow_imports = "skip"

[tool.pylint.main]
py-version = "3.12"
ignore-paths = ["^\\.venv/.*$"]
# Emil's motor code is used as it is
ignore = ["controllers.py", "DynamixelHardwareInterface.py"]
# PyTorch is optional (requirements-ml.txt): only the GRU method needs it
ignored-modules = ["torch"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-attributes = 15
max-args = 7
max-positional-arguments = 7
max-locals = 20
max-branches = 15

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "too-few-public-methods",
    "duplicate-code",  # the two GRU scripts take the same options
]
